spring.application.name=BankProjectIbk

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/minibank}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

#spring.flyway.enabled=true

server.port=8080

app.jwt.secret=${APP_JWT_SECRET:change-this-in-prod}
app.jwt.issuer=mini-bank
app.jwt.expiryMinutes=60


app.mail.from=no-reply@minibank.local
app.mail.enabled=true

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false






